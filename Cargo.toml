
[package]
name = "picus"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
embassy-futures = "0.1"

[target.'cfg(target_arch = "arm")'.dependencies]
embassy-rp = { version = "0.10", features = [
  "rp2040",
  "critical-section-impl",
  "time-driver",
  "executor-thread",
  "rom-func-cache",
] }

embassy-executor = { version = "0.10", features = ["executor-thread"] }
embassy-time = "0.5"
embassy-usb = { version = "0.6", default-features = false }
embassy-sync = "0.8"

cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "1"
static_cell = "2"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }

[profile.dev]
opt-level = 1
debug = 2

[profile.release]
opt-level = "s"
debug = 2
lto = "fat"
codegen-units = 1
